# Render blueprint for the Draper shadow-mode service.
# One web service (webhook + review UI), one managed Postgres, two cron jobs.
# Set the secret env vars (TENANT_ID, CLIENT_ID, CLIENT_SECRET, ANTHROPIC_API_KEY,
# GRAPH_CLIENT_STATE, CRON_SECRET, MAILBOX_*) in the Render dashboard, not here.

databases:
  - name: draper-shadow-db
    databaseName: draper_shadow
    plan: basic-256mb

services:
  - type: web
    name: draper-shadow
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build && npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: draper-shadow-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: draper-shadow-db
          property: connectionString
      - key: RUN_MODE
        value: shadow
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        sync: false
      - key: TENANT_ID
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: GRAPH_CLIENT_STATE
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: MAILBOX_SALES
        sync: false
      - key: MAILBOX_LETTINGS
        sync: false
      - key: MAILBOX_HELLO
        sync: false

  # Renew Graph subscriptions well inside their <3-day expiry.
  - type: cron
    name: draper-shadow-renew
    runtime: node
    plan: starter
    schedule: "0 */6 * * *"
    buildCommand: npm ci --include=dev
    startCommand: npm run subscriptions:renew
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: draper-shadow-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: draper-shadow-db
          property: connectionString
      - key: RUN_MODE
        value: shadow
      - key: PUBLIC_URL
        sync: false
      - key: TENANT_ID
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: GRAPH_CLIENT_STATE
        sync: false
      - key: MAILBOX_SALES
        sync: false
      - key: MAILBOX_LETTINGS
        sync: false
      - key: MAILBOX_HELLO
        sync: false

  # Delta backstop: catch any notifications Graph didn't deliver.
  - type: cron
    name: draper-shadow-delta
    runtime: node
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: npm ci --include=dev
    startCommand: npm run backstop:delta
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: draper-shadow-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: draper-shadow-db
          property: connectionString
      - key: RUN_MODE
        value: shadow
      - key: TENANT_ID
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: MAILBOX_SALES
        sync: false
      - key: MAILBOX_LETTINGS
        sync: false
      - key: MAILBOX_HELLO
        sync: false

  # Sender worker: sends real replies for ALLOWLISTED senders only. Disabled by
  # default — SEND_MODE is unset (=off) so this no-ops until deliberately enabled.
  # Set SEND_MODE=dry to log intended sends, SEND_MODE=live to actually send.
  # Requires Azure Mail.Send + Mail.ReadWrite (admin-consented) before going live.
  - type: cron
    name: draper-shadow-sender
    runtime: node
    plan: starter
    schedule: "*/2 * * * *"
    buildCommand: npm ci --include=dev
    startCommand: npm run send:drafts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: draper-shadow-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: draper-shadow-db
          property: connectionString
      - key: SEND_MODE
        sync: false
      - key: SEND_ALLOWLIST
        sync: false
      # Only send replies whose due time is within this many minutes (freshness
      # window). Older/backlog drafts are marked "stale" and never sent.
      - key: SEND_MAX_AGE_MINUTES
        value: "30"
      - key: TENANT_ID
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: MAILBOX_SALES
        sync: false
      - key: MAILBOX_LETTINGS
        sync: false
      - key: MAILBOX_HELLO
        sync: false
